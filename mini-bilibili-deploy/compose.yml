name: mini-bilibili

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-mini_bili}
      MYSQL_USER: ${DB_USERNAME:-mini_bili}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - app_network
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network
    logging: *default-logging

  server:
    build:
      context: ../mini-bilibili-server
      dockerfile: Dockerfile
    image: mini-bilibili-server:1.0.0
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mini_bili}
      DB_USERNAME: ${DB_USERNAME:-mini_bili}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-9000000}
      REFRESH_TOKEN_EXPIRE: ${REFRESH_TOKEN_EXPIRE:-604800000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-500MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-500MB}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?Set OSS_ENDPOINT in .env}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?Set OSS_BUCKET_NAME in .env}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:?Set OSS_PUBLIC_DOMAIN in .env}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?Set OSS_ACCESS_KEY_ID in .env}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?Set OSS_ACCESS_KEY_SECRET in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8084}:8084"
    networks:
      - app_network
    logging: *default-logging

  web:
    build:
      context: ../mini-bilibili-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: mini-bilibili-web:1.0.0
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - app_network
    logging: *default-logging

  admin:
    build:
      context: ../mini-bilibili-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: mini-bilibili-admin:1.0.0
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:80"
    networks:
      - app_network
    logging: *default-logging

  gateway:
    image: caddy:2-alpine
    profiles:
      - production
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    depends_on:
      - web
      - admin
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
