spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Local development has its own variable namespace so Docker/prod DB_*
    # variables cannot silently redirect a local run to the server database.
    url: jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:mini_bili}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.minibili.module.**.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET}
  expire: ${JWT_EXPIRE:9000000}

refresh-token:
  expire: ${REFRESH_TOKEN_EXPIRE:604800000}

cookie:
  secure: ${COOKIE_SECURE:false}
