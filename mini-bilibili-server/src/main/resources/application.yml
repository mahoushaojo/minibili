spring:
  config:
    # Support IDE runs from either the repository root or this backend module.
    # Docker prod continues to use its injected environment variables.
    import: optional:file:.env[.properties],optional:file:mini-bilibili-server/.env[.properties]
  application:
    name: mini-bilibili-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8084}

logging:
  level:
    root: info
    com.minibili: debug

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:mini-bili}
    domain: ${OSS_PUBLIC_DOMAIN:https://media.fanzhuan.online}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
